<!DOCTYPE html>
<html lang="en" style="position:fixed;inset:0;width:100%;height:100%;overflow:hidden;">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>CreatorOS</title>
    <style>
      /* Pre-React lock — prevents flash of scrollable content */
      html, body { 
        position: fixed; inset: 0; width: 100%; height: 100%;
        overflow: hidden; margin: 0; padding: 0;
        background: #0D0D0D;
      }
      #root { position: fixed; inset: 0; width: 100%; height: 100%; overflow: hidden; }
    </style>
    <script>
    // Browser polyfill for Electron IPC (preload.ts bridge)
    // All methods are no-ops that return safe defaults
    window.api = {
      version: '1.0.0',
      savePngBatch: async () => ({ ok: false, error: 'not available in browser' }),
      saveSession: () => {},
      loadSession: async () => null,
      downloadBrowserImage: async () => ({ tmpPath: '', success: false, sizeKb: 0 }),
      onAuthComplete: () => {},
      openAuthPopup: async () => {},
      openExternal: async () => {},
      clearBrowserData: async () => {},
      clearSiteData: async () => ({ removed: 0 }),
      authStart: async () => ({ url: '', codeVerifier: '', state: '' }),
      onAuthResult: () => () => {},
      authValidate: async () => ({ ok: false, error: 'not available in browser' }),
      authLogout: async () => ({ ok: false }),
      readLocalImage: async () => null,
      log: () => {},
      onImageDownloadReady: () => () => {},
      getSystemFonts: async () => [],
      showContextMenu: async () => {},
      onBrowserEvent: () => () => {},
      startImageGen: undefined,
      cancelImageGen: async () => {},
      onImageGenProgress: undefined,
      getImageGenConfig: async () => ({ chatGptUrl: '' }),
      setImageGenUrl: async () => {},
      setupCheck: async () => ({ needsSetup: true, backendStatus: 'down', missingDeps: [] }),
      setupSaveConfig: async () => ({ ok: false, error: 'not available in browser' }),
      restartBackend: undefined,
      onBackendStatus: undefined,
      onCanvasCommand: undefined,
      sendCanvasResult: () => {},
      onAppCommand: undefined,
      sendAppResult: () => {},
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
